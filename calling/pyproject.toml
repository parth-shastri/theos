[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "theos-calling"
version = "0.1.0"
description = "Private Telegram calling gateway for Theos reminders"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "telethon==1.46.0",
    "py-tgcalls==3.0.1",
    "ntgcalls==3.0.7",
]

[project.scripts]
theos-calling = "theos_calling.server:main"
theos-calling-login = "theos_calling.login:main"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.3", "httpx>=0.28,<1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

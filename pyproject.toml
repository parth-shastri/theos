[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "theos"
version = "1.2.0"
description = "Theos personal assistant with an owned Python agent harness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.11.7", "jinja2>=3.1.6,<4"]

[project.optional-dependencies]
server = [
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "markdown-it-py>=4,<5",
    "google-genai>=2.14,<3",
    "jsonschema>=4.23,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "cryptography>=46,<47",
    "croniter>=6,<7",
    "python-multipart>=0.0.20",
    "pillow>=11,<13",
    "boto3>=1.40,<2",
    "opensandbox>=0.1.7",
    "opensandbox-code-interpreter>=0.1.2",
    "mcp>=1.20,<2",
    "anthropic>=1.7.0",
    "httpx>=0.28.1",
    "openai>=1.93.0",
]
openai = ["openai>=1.93.0", "httpx>=0.28.1"]
anthropic = ["anthropic>=1.7.0"]
gemini = ["google-genai>=1.24.0"]
terminal = ["theos[server]", "rich>=14.0.0", "textual>=0.50.0"]
client = ["httpx>=0.28.1", "pydantic-settings>=2.8,<3", "rich>=14.0.0", "textual>=0.50.0"]

[project.scripts]
harness-cli = "renderer.cli:main"
theos = "theos.transports.terminal.cli:main"

[dependency-groups]
dev = ["pytest>=9.0", "pytest-asyncio>=1.3", "ruff>=0.12"]
design = ["pillow>=11.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/theos", "src/harness", "src/renderer", "src/config"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "speech", "docs", "config/jaeger.yaml", "config/rpi-connect", "README.md", "MEMORY.md", "AGENTS.md", "LICENSE", "pyproject.toml", "uv.lock", "Dockerfile", "compose.yaml", "compose.dev.yaml", "compose.tracing.yaml", ".dockerignore", ".env.minimal", ".env.full.example", ".env.client.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not live'"
markers = ["live: a test that calls a real provider API and needs its key in env/local.env"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/theos/transports/browser/app.py" = ["B008"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "theos-transcription"
version = "0.1.0"
description = "Authenticated MLX Whisper service for the Theos speech host"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.2,<3",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
theos-transcription = "theos_transcription.server:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=9", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/theos_transcription/server.py" = ["B008"]

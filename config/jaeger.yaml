# Single-node storage. The Compose volume retains traces across restarts.
extensions:
  jaeger_storage:
    backends:
      local:
        badger:
          directories:
            keys: /tmp/theos-traces/keys
            values: /tmp/theos-traces/values
          ephemeral: false
          ttl:
            spans: 168h
  jaeger_query:
    storage:
      traces: local
    http:
      endpoint: 0.0.0.0:16686
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  batch:
    send_batch_size: 256
    send_batch_max_size: 256
exporters:
  jaeger_storage_exporter:
    trace_storage: local
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]

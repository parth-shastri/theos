name: Telegram calling gateway
on:
  pull_request:
    paths: ['calling/**', '.github/workflows/calling.yml']
  push:
    branches: [dev, main, rpi]
    paths: ['calling/**', '.github/workflows/calling.yml']
permissions:
  contents: read
jobs:
  calling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.26'
          python-version: '3.12'
          enable-cache: true
      - name: Ensure FFmpeg is available
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
      - run: uv sync --project calling --locked
      - run: uv run --project calling --no-sync ruff check calling
      - run: uv run --project calling --no-sync ruff format --check calling
      - run: cd calling && uv run --no-sync pytest -q
      - run: uv build --project calling

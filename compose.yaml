name: theos
services:
  theos:
    image: ${AGENT_IMAGE:-theos:local}
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8080"
      AGENT_DATA_DIR: /data
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - theos-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AGENT_MEMORY_LIMIT:-768m}
    cpus: ${AGENT_CPU_LIMIT:-1.0}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  theos-data:
    name: ${AGENT_DATA_VOLUME:-theos-data}

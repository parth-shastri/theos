name: theos
services:
  theos:
    image: ${AGENT_IMAGE:-theos:local}
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8080"
      AGENT_DATA_DIR: /data
      AGENT_WEB_URL: ${AGENT_WEB_URL:-http://127.0.0.1:8080}
      AGENT_FRONTEND_SECRET: ${AGENT_FRONTEND_SECRET:?Set AGENT_FRONTEND_SECRET in .env}
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8081}:8080"
    volumes:
      - theos-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AGENT_MEMORY_LIMIT:-768m}
    cpus: ${AGENT_CPU_LIMIT:-1.0}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  web:
    image: ${AGENT_WEB_IMAGE:-theos-web:local}
    build:
      context: .
      target: web-runtime
    environment:
      AGENT_NAME: ${AGENT_NAME:-Theos}
      AGENT_WEB_URL: ${AGENT_WEB_URL:-http://127.0.0.1:8080}
      THEOS_API_URL: http://theos:8080
      THEOS_FRONTEND_SECRET: ${AGENT_FRONTEND_SECRET:?Set AGENT_FRONTEND_SECRET in .env}
      THEOS_CLIENT_IP_HEADER: ${THEOS_CLIENT_IP_HEADER:-}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-8080}:3000"
    depends_on:
      theos:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AGENT_WEB_MEMORY_LIMIT:-512m}
    cpus: ${AGENT_WEB_CPU_LIMIT:-1.0}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  theos-data:
    name: ${AGENT_DATA_VOLUME:-theos-data}

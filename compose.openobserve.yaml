services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENOBSERVE_UI_PORT:-5080}:5080"
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: "${OPENOBSERVE_EMAIL:?Set OPENOBSERVE_EMAIL in the private .env}"
      ZO_ROOT_USER_PASSWORD: "${OPENOBSERVE_PASSWORD:?Set OPENOBSERVE_PASSWORD in the private .env}"
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
      ZO_INGEST_ALLOWED_UPTO: "168"
    volumes:
      - openobserve-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  openobserve-data:
